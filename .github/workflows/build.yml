name: Build

# ── 发版口径：tag 只出 Windows，mac 按需手动触发 ─────────────────────────
# 推 tag 后只跑 build-windows（约占发版总时长的全部）。要 mac 包时，**不要再推一次
# tag**，直接在已有 tag 上手动触发：
#   gh workflow run build.yml --ref v0.1.2 -f with_macos=true
# 如果问题出在工作流本身（例如 v0.3.0 的 mac 资源包被 vite build 清掉），用 main 上
# 的修复版重建同一个 tag，不必移动 tag：
#   gh workflow run build.yml --ref main -f with_macos=true -f release_tag=v0.3.0
# 为什么默认关：mac 作业实测 25m50s，且与 Windows 串行（Windows 要合并 mac 的
# updater 平台片段）——v0.1.1 因此跑满 53 分钟。mac 用户占比低，每次发版陪跑不值。
#
# ── Gitee 镜像为什么不在 CI 里做（2026-11-05 实测）────────────────────────
# GitHub 的 runner 在境外，到 Gitee 的上传只有 ~50 KB/s：85MB 要推半小时以上，
# 实测 13 分钟后被 Gitee 断连（send-pack: unexpected disconnect while reading
# sideband packet）。本机直连是 2.2 MB/s、72 秒跑完，所以镜像挪到本地一条命令：
#   cd desktop && GITEE_TOKEN=xxx npm run mirror:gitee -- v0.1.2
# （脚本会自己下载资产、建发行版、传附件、推清单、回头验 raw 版本号）
#
# 🔴 附件走「发行版附件」，不走 raw 分支：Gitee raw 对 >50MB 的文件返回 403
#    `large file require login for access`，匿名客户端读不到（jdtls.zip 56MB 踩线）。
#    raw 的 releases 分支只放两份几 KB 的清单（客户端端点是固定地址）。
# 🔴 Gitee 账号是 lzul，与 GitHub 的 lzlkyb 不是同一个，别照抄仓库路径。
on:
  push:
    # tag → 发版（build-windows，mac 默认不发）；main → 只跑测试门禁。
    #
    # 为什么要加 main（沿用 cc-bridge 2026-09-02 的教训）：之前只有 `pull_request`
    # 会触发，而发版流程里 `git push origin main` 是**直推**的（不走 PR）——于是
    # 真正入主线的那一次推送反而没有任何 CI。各 job 的 `if:` 已按"非 tag"分流。
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_macos:
        description: '同时构建 macOS 包（默认不发，构建期间 Windows 要等它 ~26 分钟）'
        type: boolean
        default: false
      # 修 CI 脚本但不想动已发布 tag 时用：从 main 触发，把 tag 作为**代码检查点**
      # 去构建并发布到该 tag 的 Release。不填则照旧按 github.ref 判断。
      #   gh workflow run build.yml --ref main -f with_macos=true -f release_tag=v0.3.0
      release_tag:
        description: '要重建的已有版本 tag（从分支触发时填，如 v0.3.0；留空=用当前 ref）'
        type: string
        default: ''

# 共享编译缓存：sccache 把每个 crate 的编译对象按 hash 存到 GitHub Actions Cache，
# 跨发版 / 跨 PR 命中（依赖不变时基本秒级）；第一次或改了大段 Rust 仍要全编。
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # 前端门禁。为何需要它：CI 若只跑 Rust，前端的类型错误 / lint / 单元测试
  # 只存在于开发者本机，而本机钩子可以 --no-verify 绕过。壳子的 UI 资产
  # （设计 token、30+ ui 组件、动效回归）恰恰是复制即用的核心，必须有门禁。
  #
  # 跑 ubuntu：纯 Node 工作，不需要 Rust/系统依赖，比 windows runner 快且便宜。
  frontend:
    name: Frontend (tsc + vitest + build)
    # 🔴 故意**不**按 tag 跳过（2026-11-12 改）：这一 job 盖的是纯扫描项（体量、
    # 孤立文件、设计 token、UI 约定、tsc、vitest），而 tag 那趟恰恰是唯一产出
    # 用户产物的构建。以前它在 tag 下被 `if` 跳过，v0.5.0 就这样把 309 行的
    # ResultTable 发出去，直到手动补 mac 才暴露。
    #
    # 🔴 但**不**让 build 依赖它：红了只把 run 标红，不阻断出包。理由——CI 偶发
    # 红（runner 抖动）挡住发版的代价，比「事后发现再补一个补丁版」更大。
    # 所以「产物齐」≠「门禁绿」，release.mjs 第 9 步会把两者分开报
    # （scripts/lib/releaseGateReport.mjs）。要改成阻断只需给 build-windows 加
    # `needs: [frontend]`，但先确认接受「一个 lint 就能让发版不出包」。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: desktop
      # 门禁清单的唯一真源是 desktop/scripts/lib/gate-plan.mjs。这一步断言
      # 「workflow 里的步骤序列 == 清单里 frontend scope 的序列」：少了、多了、
      # 顺序漂了，或者谁又在这里手写了一遍命令，都在这里红。秒级，放最前。
      - name: 门禁清单 ↔ workflow 一致
        run: node scripts/gate.mjs --verify-ci
        working-directory: desktop
      - name: 组件体量门禁（行数 + 状态数）
        run: node scripts/gate.mjs --only component-size
        working-directory: desktop
      # 孤立文件 / 依赖：knip 只看 files + dependencies（export/type 存量多，暂不收紧）。
      - name: 孤立文件 / 依赖（knip）
        run: node scripts/gate.mjs --only knip
        working-directory: desktop
      # Rust generate_handler! 是命令真源；生成物过期、前端拼错命令名都在这里拦。
      - name: Tauri 命令契约（Rust ↔ TS）
        run: node scripts/gate.mjs --only contract
        working-directory: desktop
      # 裸 hex 色值只许减不许增；新增颜色必须落到 :root token。
      - name: 设计 token 棘轮
        run: node scripts/gate.mjs --only tokens
        working-directory: desktop
      # 缓动必须走 token、字号不得低于 10px；存量违规记基线，只许减。
      - name: UI 约定棘轮
        run: node scripts/gate.mjs --only ui-contract
        working-directory: desktop
      # 测试里裸用 std::env::temp_dir() 只许减不许增。纯文件扫描，不需要 Rust 工具链，
      # 所以放前端 job：这些路径问题正是「本地绿、CI 红」的主因之一。
      - name: Rust 测试临时目录棘轮
        run: node scripts/gate.mjs --only rust-tempdir
        working-directory: desktop
      # 存量违规记在 eslint-suppressions.json（棘轮，只许减少），新违规直接拦。
      - name: eslint
        run: node scripts/gate.mjs --only eslint
        working-directory: desktop
      - name: tsc --noEmit
        run: node scripts/gate.mjs --only tsc
        working-directory: desktop
      - name: vitest
        run: node scripts/gate.mjs --only vitest
        working-directory: desktop
      # vite:build 自带 tsc，上面单跑一次是为了让类型错误早一步、单独报出来。
      - name: vite build
        run: node scripts/gate.mjs --only vite-build
        working-directory: desktop
      # 体积预算必须基于真实产物，所以放在 build 之后；预算文件是棘轮。
      - name: JS 产物体积预算
        run: node scripts/gate.mjs --only bundle-budget
        working-directory: desktop

  # Rust 门禁（fmt / machete / clippy / test），用 dev 编译，快。
  #
  # 🔴 tag 发版时**也跑**（2026-11-12 改）：以前这里按 tag 跳过，理由是「build-windows
  # 内的 cargo test --release 已覆盖」——但那只覆盖 test，**不跑 clippy**。于是
  # tag 那趟的 Rust 侧唯一缺的就是 lint，v0.5.0 的 `clippy -D warnings`（命令参数
  # 8/7）正是这样在本地绿、在 CI 红。多一台 windows runner 与 26min 的 build 并行，
  # 墙钟不增，只多花额度；换「发版前一定有人验过 Rust」值得。
  # 一样不让 build 依赖它：红了标红，不阻断出包（见 frontend 的说明）。
  test:
    name: Rust test suite (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup (跨 PR 编译缓存)
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # 未使用依赖：误报登记在 src-tauri/Cargo.toml 的 cargo-machete.metadata。
      - name: cargo-machete（未使用依赖）
        uses: taiki-e/install-action@cargo-machete
      # cargo fmt --check 在本轮之前 CI 里根本不存在（只有那个从未安装过的钩子跑它），
      # 于是格式可以连着十次 push 都没人管。最便宜的检查，放最前。
      - name: cargo fmt --check
        run: node scripts/gate.mjs --only fmt
        working-directory: desktop
      - name: cargo machete
        run: node scripts/gate.mjs --only machete
        working-directory: desktop
      # clippy 排在 test 之前：lint 比跑测试快，失败早一步暴露。
      # 齐平：macOS 侧（check-macos）跑同一项，两边都 --all-targets -D warnings。
      - name: cargo clippy (与 macOS 侧同等严格)
        run: node scripts/gate.mjs --only clippy
        working-directory: desktop
      - name: cargo test
        run: node scripts/gate.mjs --only rust-test
        working-directory: desktop

  # macOS 编译门禁。为何需要它：多数桌面项目主力平台是 Windows、开发机也是
  # Windows，而平台差异（平台专属 crate feature、缺失的 cfg(not(windows)) 分支）
  # **只会在 mac 编译时暴露**。没有这道门禁，Windows 侧的改动会静默破坏 mac 支持。
  #
  # `--all-targets` 会连测试代码一起编译——mac 上跑不了的测试必须带 cfg(windows)。
  # 严格度与 Windows 侧齐平：两边都跑 `clippy --all-targets -D warnings`。
  check-macos:
    name: Rust check + test (macOS)
    # 唯一保留按 tag 跳过的门禁 job（2026-11-12 决定）：macOS runner 计费 10x，
    # 而 `build-macos` 一旦触发（`gh workflow run build.yml --ref vX -f with_macos=true`）
    # 自己就会跑 `cargo test --release`，mac 侧不至于完全没人验。代价是「只发 Windows
    # 的那趟，mac 编译覆盖为零」——已知并接受，要比对就手动带 with_macos 跑一次。
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: clippy (与 Windows 侧同等严格)
        run: node scripts/gate.mjs --only clippy
        working-directory: desktop
      # 真实跑测试，而不只是编译。壳子的 Rust 侧（config 持久化、路径白名单、
      # 更新错误分类）**不依赖 GUI**，完全能在 CI 的 mac 上验证。
      # 仍验不到的只有 GUI：托盘外观与交互、窗口行为、Gatekeeper、自动更新。
      - name: cargo test（真实执行，非仅编译）
        run: node scripts/gate.mjs --only rust-test
        working-directory: desktop

  # ── macOS 打包 / 发版（默认不发，需手动触发）──────────────────────────
  # 产出 .app.tar.gz + .sig + 平台片段（updater-macos.json），
  # 平台片段只作为 artifact 传给 build-windows 合并，不 attach 到 Release。
  #
  # `if` 两道门，缺一不可：
  #   · startsWith(refs/tags/v) —— workflow_dispatch 也能在 main 上跑，那时没有
  #     Release 可 attach，构建纯浪费；
  #   · github.event.inputs.with_macos —— push 触发的 tag 事件里 inputs 不存在，
  #     `null == 'true'` 为 false，于是推 tag 默认不发 mac。
  # 手动触发：gh workflow run build.yml --ref v0.1.2 -f with_macos=true
  build-macos:
    name: Build macOS app (arm64)
    # 两种入口：在 tag 上手动触发；或从分支（通常是 main 上的 CI 修复）触发并
    # 用 release_tag 指定要重建的 tag——代码按 tag 检出，工作流定义按分支执行。
    if: github.event.inputs.with_macos == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag || github.sha }}

      - name: 🔑 准备签名密钥（文件路径方式）
        run: |
          RAW='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          if [ -z "$(printf '%s' "$RAW" | tr -d '[:space:]')" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY 未设置。mac 包必须签名，否则 updater 验签会报"
            echo "   'The signature was created with a different key than the one provided'，"
            echo "   用户下载得到包但永远装不上。"
            echo "   生成密钥对：tauri signer generate -w ~/.tauri/my-app.key"
            echo "   公钥写进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey，"
            echo "   私钥（整个文件内容）存为仓库 secret TAURI_SIGNING_PRIVATE_KEY。"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/tauri-signing.key"
          printf '%s' "$RAW" > "$KEY_FILE"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        run: |
          npm ci
          npm install @tauri-apps/cli-darwin-arm64 --no-save || true
        working-directory: desktop

      # tag 发版时 check-macos 作业被跳过，而 main 的 push 也不在触发列表里，
      # 所以如果这里不跑，mac 侧在发版时就**完全没有测试覆盖**。
      # 用 release profile 跑，编译产物直接被下面 tauri build 复用。
      - name: cargo test (release, 复用后续 build 的编译产物)
        run: cargo test --release --no-default-features
        working-directory: desktop/src-tauri

      - name: Build macOS .app
        run: |
          npm run prebuild
          # bundle.targets 固定为 nsis（Windows 发版用），mac 用 --bundles 覆盖。
          npx tauri build --bundles app
        working-directory: desktop

      # 🔴 必须放在 `npm run prebuild` 之后：prebuild 里的 `vite build` 会清空
      # desktop/dist，把这里打好的资源包与 resources.json 一起删掉。放前面的
      # 后果是 Build macOS 步骤成功、Collect artifacts 才报 `No such file`。
      # 资源包只作为 Release 资产，不参与 tauri 打包（conf 只收 ncdb.jar）。
      - name: Package macOS database runtimes
        working-directory: desktop
        env:
          RESOURCES_PLATFORMS: macos
          RESOURCES_ONLY: ncdb
          GITHUB_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -e
          for arch in arm64 x64; do
            export NCFORGE_NCDB_ARCH=$arch
            node scripts/fetch-ncdb.mjs --force
            node scripts/pack-resources.mjs
            if [ -f dist/resources.json ]; then cp dist/resources.json dist/resources-previous.json; export RESOURCES_MERGE_INTO="$PWD/dist/resources-previous.json"; fi
            node scripts/generate-resources-json.mjs
          done

      # 平台片段由 build-windows 合并进 updater.json（它要 darwin-aarch64 那条）。
      # 片段里的 version/notes 不重要：合并时只取 platforms，顶层字段由 Windows 侧提供。
      # Gitee 变体的片段不再在 CI 生成——镜像已挪到本地（见文件顶部说明）。
      - name: 生成 mac 平台片段（GitHub 路径）
        run: |
          set -e
          UPDATER_OUTPUT_FILENAME=updater-macos.json npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          UPDATER_DOWNLOAD_BASE: "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download"

      - name: 校验 darwin-aarch64 签名非空
        run: |
          node -e "
            const j=require('./dist/updater-macos.json');
            const p=j.platforms['darwin-aarch64'];
            if(!p || !p.signature || !p.signature.trim()){
              console.error('❌ updater-macos.json 的 darwin-aarch64.signature 为空。');
              console.error('   mac 客户端会下载到包但验签失败、永远装不上。');
              process.exit(1);
            }
            console.log('darwin-aarch64 签名校验通过，url=' + p.url);
          "
        working-directory: desktop

      - name: 📦 打包给用户下载的 zip
        working-directory: desktop
        run: |
          set -e
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          APP_DIR=src-tauri/target/release/bundle/macos
          APP_NAME=$(node -e "console.log(require('./src-tauri/tauri.conf.json').productName)")
          ZIP="nc-forge_${VERSION}_aarch64-apple-darwin.zip"
          # 用 ditto 而不是 zip：它会保留 .app 的资源叉与符号链接，
          # 普通 zip 会破坏 bundle 结构导致解压后打不开。
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/$APP_NAME.app" "$ZIP"
          echo "✅ $ZIP  ($(du -h "$ZIP" | cut -f1))"

      - name: Collect artifacts
        # cwd 必须落在 desktop：下面 cp 的 src-tauri/... 与 dist/... 都是相对
        # desktop 的路径。漏了这行的后果不是报错而是**静默收集空**——
        # cp 带 2>/dev/null || true，ls 只列 dist-out，attach 又是
        # fail_on_unmatched_files: false，一路绿灯但产物一个都没上去。
        working-directory: desktop
        run: |
          set -e
          mkdir -p dist-out
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-out/ 2>/dev/null || true
          cp nc-forge_*_aarch64-apple-darwin.zip dist-out/ 2>/dev/null || true
          # 平台片段只作为 artifact 传给 build-windows 合并，**不** attach 到 Release
          cp dist/updater-macos.json dist-out/ 2>/dev/null || true
          cp dist/resource-packs/ncdb-macos-*.zip dist-out/
          cp dist/resources.json dist-out/resources-macos.json
          ls -l dist-out

      - uses: actions/upload-artifact@v5
        with:
          name: nc-forge-macos
          # 🔴 uses: 步骤没有 working-directory（配了也被忽略），cwd 永远是
          # 仓库根。上面 Collect artifacts 的 cwd 是 desktop（它的 cp 路径
          # 按 desktop 相对写），所以这里必须带 desktop/ 前缀——写 dist-out/*
          # 会在仓库根找不到目录，upload 只 warn "No files were found" 然后
          # 静默跳过（warning 不 fail job），下游 Windows job 下载不到片段，
          # updater.json 缺 mac 条目，而两个 job 全是绿的。
          path: desktop/dist-out/*

      # 只 attach 用户/updater 要下载的东西。updater.json 由 build-windows 合并后统一 attach，
      # 在这里 attach 会与它冲突。
      - name: Attach macOS 产物到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 同 upload：uses: 步骤 cwd 是仓库根，产物在 desktop/dist-out/。
          # 少了 desktop/ 前缀时 fail_on_unmatched_files: false 会让 attach
          # 静默跳过，Release 上永远看不到 mac 产物而 job 全绿。
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            desktop/dist-out/*.app.tar.gz
            desktop/dist-out/*.app.tar.gz.sig
            desktop/dist-out/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发版构建：仅 tag 触发。test(release) 与 build 同 job 内复用 release target，
  # 依赖 crate 只编译一遍；sccache 让依赖不变时后续发版秒级命中。
  build-windows:
    name: Build Windows exe + installer
    # needs 使它在 mac 之后跑——因为它要合并 mac 的平台片段。两条前提：
    #   · mac 默认被 `if` 关掉时，needs 立即满足，Windows 立刻起跑（不白等）；
    #   · `always()` 保证 **mac job 失败时 Windows 仍能发**（Windows 是主平台，
    #     不应被 mac 拖累）；此时下载片段会被跳过，generate 脚本对缺失的
    #     UPDATER_MERGE_INTO 只 warn，于是降级为只发 Windows 条目。
    needs: [build-macos]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag)
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要写权限（默认 token 只读）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag || github.sha }}

      # 拉 mac 的平台片段与产物。mac 默认不发（job 被 skipped），此时不必去下载：
      # download-artifact 找不到 artifact 会红色报错（靠 continue-on-error 兜住），
      # 日志里一条多余的失败很容易被当成真故障。continue-on-error 仍保留，
      # 因为 mac 真跑起来但产物上传失败时，Windows 不该被连带拖死。
      - name: 下载 mac 产物（用于合并 updater.json；缺失则降级为只发 Windows）
        id: dl-mac
        if: needs.build-macos.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: nc-forge-macos
          path: mac-artifact

      - name: 🔑 准备签名密钥（文件路径方式）
        shell: pwsh
        run: |
          $raw = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Host "⚠️ TAURI_SIGNING_PRIVATE_KEY 未设置，本次构建将不产生签名（.sig），updater 无法验证。"
            "TAURI_KEY_FILE=" >> $env:GITHUB_ENV
            exit 0
          }
          $keyFile = "${{ runner.temp }}\tauri-signing.key"
          [System.IO.File]::WriteAllText($keyFile, $raw, [System.Text.Encoding]::ASCII)
          "TAURI_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
          Write-Host "密钥文件已写入: $keyFile"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # 缓存 npm 下载（~/.npm），npm ci 仍重装但省去网络下载。
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Sccache Setup (跨发版编译缓存)
        uses: mozilla/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      # 用 release profile 跑测试，编译出的 release 依赖产物直接被下面 tauri build 复用。
      - name: cargo test (release, 复用后续 build 的编译产物)
        run: cargo test --release --no-default-features
        working-directory: desktop/src-tauri

      # 生成链性能门禁：release 口径对照 benchmarks/bmf-gen-budget.json。
      # CI 上没有真实 NC_HOME，只跑合成语料（典型主子表 + 100×50 病态样本），
      # 断言 P95/硬上限；超预算直接失败并打印阶段耗时。
      - name: 生成性能门禁 (release, 合成语料)
        run: cargo test --release --no-default-features --test bmf_gen_perf -- --ignored --nocapture --test-threads=1
        working-directory: desktop/src-tauri

      - name: Build Tauri desktop app (NSIS installer)
        shell: pwsh
        run: |
          # Workaround for https://github.com/npm/cli/issues/4828 — Tauri CLI 的 Windows native binding
          # 是 optionalDependencies，在 fresh runner 上可能不被 npm 安装，导致 tauri build 报
          # Cannot find native binding。显式再装一次（幂等），不写回 package.json（--no-save）。
          npm install @tauri-apps/cli-win32-x64-msvc --no-save
          # prebuild（版本同步 + 生成 changelog.generated.ts）独立执行，
          # 避免在 npm run 的 pre→build 钩子链中改写 package.json 导致后续 tauri 路径丢失。
          npm run prebuild
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_KEY_FILE
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""   # 空密码，避免 CI 无 TTY 时交互式提示卡死
          # npx 直接从 node_modules/.bin 解析 tauri，不依赖 npm run 的 PATH 上下文。
          npx tauri build
        working-directory: desktop

      # 资源外置（方案 B）：jdtls/ecj/svnkit 不再进安装包（安装包 ~8MB），
      # 发版时打成 zip + 生成 resources.json，客户端首启按需下载。
      # jdtls 首次拉取 54MB，放这里并行等待；zip 内容与构建产物无关。
      - name: 打包资源包（zip + SHA-256）
        shell: pwsh
        run: node scripts/pack-resources.mjs
        working-directory: desktop

      - name: 生成 resources.json（ghproxy 镜像 URL）
        shell: pwsh
        run: |
          if (Test-Path "${{ github.workspace }}\mac-artifact\resources-macos.json") { $env:RESOURCES_MERGE_INTO = "${{ github.workspace }}\mac-artifact\resources-macos.json" }
          npm run resources:json
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          # 与 updater.json 同口径：zip 下载走 ghproxy 镜像；元数据检查另有
          # tauri.conf.json 的 GitHub Release 端点兜底（两个端点，见 resource_pack.rs）。
          RESOURCES_DOWNLOAD_BASE: "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download"

      - name: 抽取更新说明 (CHANGELOG)
        shell: pwsh
        run: |
          $changelog = Get-Content -Raw -Path CHANGELOG.md
          # 抽取「用户向分类小节」（含顶部 ### 更新摘要，渲染为弹框高亮卡片），写入更新弹框。
          # 每个小节下列 1~3 条人话要点（无代码符号、无根因），让用户一眼看懂升级了什么。
          # 正则要求版本号形如 x.y.z，避免误抓 [Unreleased]；抓到下一个版本头为止。
          # 剔除不进弹框的小节：### 用户摘要 / ### 技术细节 / ### 实现说明 / ### 开发者。
          if ($changelog -match '(?s)##\s*\[\d+\.\d+\.\d+\][^\n]*\n(.*?)(?=\n##\s\[|$)') {
            $notes = $matches[1].Trim()
            $notes = $notes -replace '(?s)\n###\s*(用户摘要|技术细节|实现说明|开发者)[\s\S]*?(?=\n###\s|\n##\s|$)', ''
            $notes = $notes.Trim()
            "UPDATER_NOTES<<EOF" >> $env:GITHUB_ENV
            $notes >> $env:GITHUB_ENV
            "EOF" >> $env:GITHUB_ENV
            Write-Host "已抽取用户向分类说明 ($($notes.Length) 字符)"
          } else {
            Write-Host "未在 CHANGELOG 中找到已发布版本段，使用默认说明"
          }

      - name: 生成 updater.json（合并 mac 平台条目）
        shell: pwsh
        run: npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          # 合并 mac 片段：不接这一句的后果是 mac 条目根本不进 updater.json，
          # mac 用户永远检测不到更新且不报错。指向不存在的文件时脚本只 warn，
          # 所以 mac job 挂了也不会把 Windows 发版带倒。
          UPDATER_MERGE_INTO: ${{ github.workspace }}\mac-artifact\updater-macos.json
          # 二进制下载走 ghproxy 镜像，解决国内用户下载慢；元数据检查另有 tauri.conf.json 的 GitHub 端点兜底。
          # 注意：updater.json 的 url 为单值、无二进制级兜底，故 ghproxy 域名需稳定；若失效改此 env + config 即可。
          UPDATER_DOWNLOAD_BASE: "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download"

      - name: 校验 updater.json 签名非空
        shell: pwsh
        run: |
          $json = Get-Content -Raw -Path desktop/dist/updater.json | ConvertFrom-Json
          $sig = $json.platforms.'windows-x86_64'.signature
          if ([string]::IsNullOrWhiteSpace($sig)) {
            Write-Error "updater.json 的 windows-x86_64.signature 为空，自动更新将无法校验签名。请确认 TAURI_SIGNING_PRIVATE_KEY 已配置且构建产生 .sig。"
            exit 1
          }
          Write-Host "updater.json windows-x86_64 签名校验通过"

          # mac 条目的合并结果必须显式确认：它缺失时**不会报错**，mac 用户只是
          # 永远检测不到更新——这种静默失效必须在发版时就看到。
          $macFragment = "${{ github.workspace }}\mac-artifact\updater-macos.json"
          $darwin = $json.platforms.'darwin-aarch64'
          if (Test-Path $macFragment) {
            if ($null -eq $darwin -or [string]::IsNullOrWhiteSpace($darwin.signature)) {
              Write-Error "mac 片段存在但 darwin-aarch64 未合并进 updater.json（或签名为空）。这会让 mac 用户静默失去自动更新，终止发版。"
              exit 1
            }
            Write-Host "updater.json darwin-aarch64 已合并，url=$($darwin.url)"
          } else {
            Write-Host "⏭️ 本次未包含 mac（发版默认不发 mac）。updater.json 只含 Windows 条目。"
            Write-Host "   要补 mac：gh workflow run build.yml --ref ${{ github.ref_name }} -f with_macos=true"
            Write-Host "   （不要重推 tag；该命令在同一个 tag 上重跑，产物会 attach 到同一个 Release。）"
          }
          Write-Host "最终平台条目：$($json.platforms.PSObject.Properties.Name -join ', ')"

      - name: 📦 打包绿色便携版
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = "desktop/src-tauri/target/release/nc-forge.exe"
          $zipName = "nc-forge_$version`_x86_64-pc-windows-msvc.zip"

          if (-not (Test-Path $exePath)) {
            Write-Host "❌ 绿色版 exe 不存在: $exePath"
            exit 1
          }

          $exeDir = Split-Path $exePath -Parent
          $exeName = Split-Path $exePath -Leaf
          $zipFullPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Push-Location $exeDir
          Compress-Archive -Path $exeName -DestinationPath $zipFullPath -Force
          Pop-Location

          Write-Host "✅ 绿色版打包完成: $zipName"
          Write-Host "文件大小: $((Get-Item $zipFullPath).Length / 1MB) MB"

      - name: Collect artifacts
        shell: pwsh
        run: |
          mkdir dist-out -ErrorAction SilentlyContinue
          Copy-Item desktop\src-tauri\target\release\bundle\nsis\*.exe dist-out\ -ErrorAction SilentlyContinue
          Copy-Item desktop\src-tauri\target\release\bundle\nsis\*.exe.sig dist-out\ -ErrorAction SilentlyContinue
          Copy-Item desktop\dist\updater.json dist-out\ -ErrorAction SilentlyContinue
          Copy-Item nc-forge_*.zip dist-out\ -ErrorAction SilentlyContinue
          # 资源包（方案 B）：三个 zip + 客户端首启读的 resources.json。
          # 漏了 zip 的后果不是报错而是静默：resources.json 在 Release 上，
          # 客户端按 url 下载 404 → 首启组件下载全部失败（event error）。
          Copy-Item desktop\dist\resource-packs\*.zip dist-out\ -ErrorAction SilentlyContinue
          Copy-Item mac-artifact\ncdb-macos-*.zip dist-out\ -ErrorAction SilentlyContinue
          Copy-Item desktop\dist\resources.json dist-out\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        with:
          name: nc-forge-windows
          path: dist-out/*

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist-out/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

