<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCForge</title>
    <link rel="preload" href="/src/assets/fonts/NotoSansSC-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Bundle 加载前恢复窗口颜色和导航宽度，避免首帧闪回上一套布局。
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
        if (localStorage.getItem("ncforge-rail-expanded") === "1") document.documentElement.dataset.bootRail = "expanded";
        if (localStorage.getItem("ncforge.ui-density") === "comfortable") document.documentElement.dataset.uiDensity = "comfortable";
      } catch (_) { /* 存储不可用时采用浅色紧凑导航。 */ }
    </script>
    <style>
      :root {
        --sk-bg: #eef1f2;
        --sk-card: #ffffff;
        --sk-border: #dfe3e6;
        --sk-block: #dfe3e6;
        --sk-ink: #636d77;
        --sk-sheen: rgb(255 255 255 / .45);
        --sk-nav: 60px;
      }
      :root.dark {
        color-scheme: dark;
        --sk-bg: #1b1f23;
        --sk-card: #202429;
        --sk-border: #353c43;
        --sk-block: #353c43;
        --sk-ink: #a5aeb8;
        --sk-sheen: rgb(255 255 255 / .08);
      }
      :root[data-boot-rail="expanded"] { --sk-nav: 148px; }
      html, body { margin:0; height:100%; background:var(--sk-bg); }
      #root { height:100%; }
      .boot { display:flex; flex-direction:column; height:100%; overflow:hidden; font:13px/1.5 var(--font-sans,"Noto Sans SC","Segoe UI","Microsoft YaHei UI",sans-serif); }
      .boot-hd { display:flex; align-items:center; flex:none; gap:10px; height:40px; padding:0 12px; }
      .boot-brand { display:flex; align-items:center; gap:7px; color:var(--sk-ink); font-weight:600; }
      .boot-brand img { display:block; border-radius:6px; }
      .boot-search { width:clamp(230px,32vw,440px); height:28px; margin-inline:auto; border:1px solid var(--sk-border); border-radius:6px; background:var(--sk-card); }
      .boot-controls,.boot-window-group { display:flex; align-items:center; flex:none; gap:0; }
      .boot-tool { width:28px; height:28px; display:grid; place-items:center; margin-right:4px; }
      .boot-window { width:44px; height:40px; display:grid; place-items:center; }
      .boot-body { display:flex; flex:1; min-height:0; min-width:0; padding-right:5px; }
      .boot-side { width:var(--sk-nav); flex:none; display:flex; flex-direction:column; }
      .boot-side-nav { display:flex; flex:1; flex-direction:column; gap:5px; padding:7px 5px; }
      .boot-nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:53px; border-radius:6px; }
      .boot-nav-item.on { background:var(--sk-card); }
      .boot-nav-icon { width:19px; height:19px; }
      .boot-nav-label { width:30px; height:10px; }
      .boot-side-foot { padding:6px; }
      :root[data-boot-rail="expanded"] .boot-nav-item { flex-direction:row; justify-content:flex-start; min-height:36px; padding-inline:10px; gap:10px; }
      :root[data-boot-rail="expanded"] .boot-nav-label { width:64px; }
      .boot-main { display:flex; flex:1; flex-direction:column; min-height:0; min-width:0; }
      .boot-surface { display:flex; flex:1; min-height:0; overflow:hidden; border:1px solid var(--sk-border); border-radius:8px 8px 0 0; background:var(--sk-card); }
      .boot-tree { width:240px; flex:none; padding:12px; box-sizing:border-box; border-right:1px solid var(--sk-border); background:var(--sk-bg); }
      .boot-tree .sk { height:10px; margin-bottom:16px; }
      .boot-editor { display:flex; flex:1; flex-direction:column; min-width:0; }
      .boot-tabs { display:flex; align-items:center; gap:12px; height:36px; flex:none; padding-inline:12px; border-bottom:1px solid var(--sk-border); background:var(--sk-bg); }
      .boot-loading { display:grid; place-content:center; flex:1; color:var(--sk-ink); }
      .boot-status { display:flex; align-items:center; gap:12px; height:26px; flex:none; padding-inline:9px; }
      .sk { position:relative; overflow:hidden; border-radius:4px; background:var(--sk-block); }
      .sk.live::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,var(--sk-sheen),transparent); animation:boot-sheen 1.3s linear infinite; }
      @keyframes boot-sheen { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
      @media(max-width:850px) { .boot-tree { width:200px; } .boot-window { width:32px; } .boot-search { width:clamp(150px,24vw,300px); } }
      @media(max-width:650px) { .boot-tree,.boot-hd>.sk { display:none; } }
      @media(prefers-reduced-motion:reduce) { .sk.live::after { display:none; animation:none; } }
    </style>
    <style>html[data-ui-density="comfortable"] .boot-loading { font-size:14px; }</style>
  </head>
  <body>
    <div id="root">
      <!-- React 挂载时整体接管；这里仅展示已批准的窗口框架。 -->
      <div class="boot">
        <header class="boot-hd" aria-hidden="true">
          <div class="boot-brand"><img src="/icon.png" alt="" width="20" height="20" /><span>NCForge</span></div>
          <div class="sk" style="width:20px;height:18px"></div>
          <div class="sk live" style="width:100px;height:12px"></div>
          <div class="boot-search"></div>
          <div class="boot-controls"><div class="boot-tool"><div class="sk" style="width:16px;height:16px"></div></div><div class="boot-tool"><div class="sk" style="width:16px;height:16px"></div></div><div class="boot-window-group"><div class="boot-window"><div class="sk" style="width:16px;height:16px"></div></div><div class="boot-window"><div class="sk" style="width:16px;height:16px"></div></div><div class="boot-window"><div class="sk" style="width:16px;height:16px"></div></div></div></div>
        </header>
        <div class="boot-body">
          <aside class="boot-side" aria-hidden="true">
            <nav class="boot-side-nav">
              <div class="boot-nav-item on"><div class="sk boot-nav-icon"></div><div class="sk boot-nav-label"></div></div>
              <div class="boot-nav-item"><div class="sk boot-nav-icon"></div><div class="sk boot-nav-label"></div></div>
              <div class="boot-nav-item"><div class="sk boot-nav-icon"></div><div class="sk boot-nav-label"></div></div>
              <div class="boot-nav-item"><div class="sk boot-nav-icon"></div><div class="sk boot-nav-label"></div></div>
            </nav>
            <div class="boot-side-foot"><div class="boot-nav-item"><div class="sk boot-nav-icon"></div><div class="sk boot-nav-label"></div></div></div>
          </aside>
          <main class="boot-main">
            <div class="boot-surface">
              <aside class="boot-tree" aria-hidden="true"><div class="sk live" style="width:72%"></div><div class="sk" style="width:54%"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:63%"></div></aside>
              <section class="boot-editor">
                <div class="boot-tabs" aria-hidden="true"><div class="sk live" style="width:90px;height:12px"></div><div class="sk" style="width:66px;height:12px"></div></div>
                <div class="boot-loading" role="status">正在打开工作台…</div>
              </section>
            </div>
            <footer class="boot-status" aria-hidden="true"><div class="sk" style="width:100px;height:9px"></div><div style="flex:1"></div><div class="sk" style="width:70px;height:9px"></div></footer>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
