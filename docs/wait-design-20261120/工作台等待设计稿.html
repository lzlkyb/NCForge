<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCForge · 轻量等待反馈</title>
<style>
:root{color-scheme:light;--ink:#24352f;--muted:#50635c;--line:#dce4df;--paper:#fff;--wash:#f5f7f5;--tint:#e7efe9;--accent:#266951;--warn:#963d30;font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#edf0ed}
*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit;color:inherit}button,select{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}
main{max-width:1400px;margin:auto;padding:22px clamp(10px,3vw,40px)}.review,.controls,.top,.head,footer,.tabs{display:flex;align-items:center;gap:10px}.review{justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.review h1{font-size:17px;margin:0}.controls{flex-wrap:wrap;gap:6px}.controls label,.muted,small{color:var(--muted)}
.shell{position:relative;background:var(--paper);border:1px solid #cbd6cf;border-radius:9px;overflow:hidden}.top{height:40px;padding:0 13px;background:var(--wash);border-bottom:1px solid var(--line);font-weight:600}.brand{background:#a75f45;color:white;border-radius:4px;padding:1px 5px}.spacer{flex:1}.layout{display:grid;grid-template-columns:64px minmax(0,1fr)}.rail{background:var(--wash);border-right:1px solid var(--line);padding:8px 5px}.rail button{display:block;width:100%;margin-bottom:4px;padding-inline:3px;white-space:nowrap;border-color:transparent;background:transparent}.rail button[aria-pressed=true]{background:var(--tint);color:var(--accent);font-weight:600}.tabs{height:37px;background:var(--wash);border-bottom:1px solid var(--line);padding-inline:14px}.tabs strong{padding:8px 2px 7px;border-bottom:2px solid var(--accent);font-weight:600}
.editor{padding:14px 15px 15px;display:grid;grid-template-columns:23px minmax(0,1fr);gap:8px;height:245px;font:14px/1.65 Consolas,monospace}.editor pre{color:var(--muted);text-align:right;margin:0}.editor textarea{border:0;padding:0;width:100%;height:100%;resize:none;background:var(--paper);color:#2f5668;font:inherit}
.result{min-height:226px;border-top:1px solid var(--line)}.head{padding:0 12px;height:32px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden}.head strong{color:var(--accent)}.source-label{color:var(--muted);flex-shrink:0}.status{display:flex;position:relative;align-items:center;gap:6px;max-width:290px;min-width:0;height:26px;border-color:transparent;font-size:12px;color:var(--muted);background:transparent;text-align:left}.status span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status[data-tone=bad],#tasks[data-tone=bad]{color:var(--warn)}.signal{display:inline-block;width:8px;height:8px;border:1px solid currentColor;border-radius:50%;flex:none;color:var(--accent)}.signal[data-wait=true]{animation:breathe 2.6s ease-in-out infinite}.signal[hidden]{display:none}@keyframes breathe{50%{opacity:.38}}
.reduce .signal,.off .signal{animation:none}@media(prefers-reduced-motion:reduce){.signal{animation:none!important}}
table{border-collapse:collapse;width:100%;text-align:left;font-variant-numeric:tabular-nums}th,td{padding:6px 13px;border-bottom:1px solid var(--line)}th{font-size:12px;font-weight:600;background:var(--wash);color:var(--muted)}td:last-child,th:last-child{text-align:right}
footer{height:32px;padding:0 8px 0 12px;font-size:12px;border-top:1px solid var(--line);background:var(--wash);color:var(--muted)}footer button{padding:1px 8px;border-color:transparent;background:transparent}
.drawer{position:absolute;right:8px;bottom:35px;width:min(360px,calc(100% - 16px));max-height:min(380px,90%);overflow:auto;background:var(--paper);border:1px solid #cbd6cf;border-radius:7px;padding:12px;box-shadow:0 5px 18px #24352f1a}.drawer h2{font-size:13px;margin:0}.drawer p{margin:7px 0}.drawer .title{font-weight:600}.drawer .bad{color:var(--warn)}.drawer-head,.actions,.metrics{display:flex;align-items:center;gap:7px}.drawer-head{justify-content:space-between}.metrics{justify-content:space-between;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}progress{width:100%;height:6px;display:block;margin:8px 0;accent-color:var(--accent)}.actions{margin-top:11px;flex-wrap:wrap}details{margin-top:9px;color:var(--muted);font-size:12px}summary{cursor:pointer}ol{padding-inline-start:19px}.reviewnote{margin:8px 0;color:var(--muted);font-size:12px}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:640px){.layout{grid-template-columns:60px minmax(0,1fr)}.source-label{display:none}.head{gap:4px}.editor{padding-inline:6px}.status{max-width:200px}th,td{padding-inline:7px}}
</style>
</head>
<body>
<main>
  <div class="review">
    <h1>轻量等待反馈 · 评审稿</h1>
    <div class="controls">
      <select id="scenario" aria-label="演示场景"><option value="export">结果导出</option><option value="sql">慢查询</option><option value="build">模块编译</option><option value="import">批量导入</option></select>
      <button id="next">推进事件</button><button id="fault">模拟异常</button><button id="reset">重置</button>
      <label><input type="checkbox" id="reduce"> 减少动效</label>
    </div>
  </div>
  <div class="shell">
    <div class="top"><span class="brand">N</span> NCForge <span class="muted">/ newar</span></div>
    <div class="layout">
      <nav class="rail" aria-label="工作台"><button id="railcode" type="button">代码</button><button id="raildb" type="button">数据库</button></nav>
      <section>
        <div class="tabs"><strong id="tab"></strong></div>
        <div class="editor"><pre aria-hidden="true">1
2
3</pre><textarea aria-label="示例编辑器" spellcheck="false"></textarea></div>
        <section class="result" aria-label="工作台输出">
          <div class="head"><strong id="head"></strong><span id="tablelabel" class="source-label"></span><span class="spacer"></span><button id="inline" class="status" aria-controls="drawer" aria-expanded="false"><span class="signal" aria-hidden="true"></span><span id="compact"></span></button></div>
          <table id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
          <p class="muted" id="away" style="padding-inline:12px" hidden>工作区就绪</p>
        </section>
      </section>
    </div>
    <footer><span id="context"></span><span class="spacer"></span><button id="tasks" aria-controls="drawer" aria-expanded="false"></button></footer>
    <section class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
      <div class="drawer-head"><h2 id="drawer-title">任务详情</h2><button id="close" aria-label="关闭任务详情">关闭</button></div>
      <small id="subject"></small>
      <p class="title" id="title"></p>
      <div class="metrics"><span id="left"></span><span id="estimate"></span></div>
      <progress id="track" max="100" aria-label="当前阶段已完成工作量"></progress>
      <p class="muted" id="detail"></p>
      <div class="actions"><button id="source">返回任务来源</button><button id="stop">请求停止</button></div>
      <details id="records"><summary>任务记录</summary><ol id="log"></ol></details>
    </section>
  </div>
  <p class="reviewnote">演示数据。用「推进事件」模拟进度更新，可切页、输入草稿，或点右下角「任务」查看详情。</p>
  <span class="screenreader" role="status" id="announce"></span>
</main>
<script src="workbench.js"></script>
</body>
</html>
