<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCForge 代码区图标第二版</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  body { margin: 0; background: #edf3f4; color: #192b32; }
  main { width: min(900px, 100%); margin: auto; padding: 32px 24px 26px; }
  header { margin: 0 auto 22px; max-width: 756px; }
  .edition { font-size: 11px; font-weight: 650; letter-spacing: .12em; color: #35645f; text-transform: uppercase; }
  h1 { font-size: clamp(24px, 3.5vw, 34px); font-weight: 680; letter-spacing: -.025em; margin: 7px 0 7px; line-height: 1.14; }
  header p { margin: 0; font-size: 13px; line-height: 1.65; color: #49626a; }
  .comparison { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
  .column { flex: 0 1 240px; min-width: 0; }
  .caption { margin: 0 1px 7px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .caption strong { font-size: 13px; }
  .caption span { color: #4c6670; font-size: 11px; }
  .tree {
    --paper: #fafcfd; --surface: #f2f7f8; --line: #d7e2e5; --ink: #263a43; --muted: #4f6972;
    --blue: #2e61ab; --teal: #24776e; --violet: #754b9b; --amber: #965018; --slate: #516a84; --green: #39744d;
    --cut: #fff; --current: #e3f0ee; --select: #cee8e2; --status: #89501c;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 9px;
    overflow: hidden; box-shadow: 0 8px 21px #23445312;
  }
  .tree.dark {
    color-scheme: dark;
    --paper: #19262e; --surface: #1e3038; --line: #364b56; --ink: #e4edf0; --muted: #a3b8bf;
    --blue: #92baff; --teal: #82d2c4; --violet: #c5a9ef; --amber: #f1b77e; --slate: #a4b9d3; --green: #9ad2a9;
    --cut: #19262e; --current: #223b43; --select: #2b4d52; --status: #f0bb83;
  }
  .bar { min-height: 35px; display:flex; align-items:center; justify-content:space-between; padding: 0 10px; background: var(--surface); border-bottom:1px solid var(--line); font-size: 12px; font-weight: 650; }
  .bar .mode { font-size:11px; font-weight:550; padding:2px 6px; color:var(--teal); border:1px solid var(--line); border-radius:4px; }
  .list { padding: 6px 5px; }
  .row { display:flex; align-items:center; gap:5px; padding-inline:calc(6px + var(--depth,0) * 12px) 6px; height:25px; border-radius:4px; min-width:0; font-size:12px; white-space:nowrap; }
  .tree:not(.previous) .row { position:relative; }
  .tree:not(.previous) .row:not([data-depth="0"])::before { content:""; position:absolute; inset-block:0; inset-inline-start:calc(10px + (var(--depth) - 1) * 12px); width:1px; background:var(--line); pointer-events:none; }
  .row[data-current] { background:var(--current); font-weight:650; }
  .row[data-active] { background:var(--select); font-weight:600; }
  .row[data-group="true"] { font-weight:600; }
  .caret { flex:0 0 10px; color:var(--muted); }
  .caret svg { display:block; }
  .icon { flex:0 0 16px; width:16px; height:16px; display:block; color:var(--tone, var(--slate)); }
  .name { flex:1 1 auto; min-width:0; display:flex; overflow:hidden; }
  .stem { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .ext { flex:none; }
  .row[data-active] .ext { color:var(--teal); }
  .badge { flex:none; min-width:12px; color:var(--status); font-size:10px; line-height:15px; font-weight:700; text-align:center; }
  .badge.test { color:var(--teal); padding-inline:3px; background:var(--current); border-radius:3px; }
  .bottom { border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; height:28px; padding-inline:10px; color:var(--muted); font-size:11px; }
  .note { margin:16px auto 0; max-width:756px; display:flex; flex-wrap:wrap; gap:8px 22px; color:#405e66; font-size:11.5px; line-height:1.55; }
  .note b { color:#233d45; }
  .sample-icons { --cut:#fff; --teal:#24776e; --blue:#2e61ab; --amber:#965018; display:inline-flex; align-items:center; gap:12px; }
  .sample-icons span { display:inline-flex; align-items:center; gap:4px; }
  @media(max-width:540px) { main { padding:24px 12px 18px; } header { max-width:300px; } .note { max-width:300px; } }
</style>
</head>

<main>
  <header>
    <div class="edition">NCForge · 代码工作区</div>
    <h1>资源树图标 · 第二版</h1>
    <p>同一份工程、同样的 16px 图标。左边是上一版，右边两列展示第二版的浅色和深色效果。</p>
  </header>
  <div class="comparison" id="comparison"></div>
  <div class="note"><span><b>NC 声明</b>　REST 端点、UPM 插接、AOP 交织、BMF 实体关系、BPF 分支流程</span><span class="sample-icons" id="member-icons"></span></div>
</main>
<script>
const nodes = [
  ["project", "newar", 0, "open"],
  ["source", "bill/src/public", 1, "open"],
  ["package", "nccloud.api.util", 2, "open"],
  ["class", "VoucherServiceImpl.java", 3],
  ["interface", "VoucherService.java", 3],
  ["enum", "VoucherMode.java", 3],
  ["annotation", "AuditTrail.java", 3],
  ["record", "VoucherKey.java", 3],
  ["source", "bill/src/test", 1, "closed", "T"],
  ["folder", "META-INF", 1, "open"],
  ["rest", "eyeInterfaceSettlementQuery.rest", 2, "", "M"],
  ["upm", "P_EyeAdjustBill.upm", 2],
  ["aop", "eyevim.aop", 2],
  ["bmf", "ArrivalGoods.bmf", 2],
  ["bpf", "ArrivalProcess.bpf", 2],
  ["folder", "resources", 1, "open"],
  ["xml", "mapping.xml", 2],
  ["sql", "query.sql", 2],
  ["config", "app.properties", 2],
  ["archive", "nc-api.jar", 2],
];
const tone = {project:"slate", source:"teal", package:"slate", folder:"slate", class:"blue", interface:"teal", enum:"violet", annotation:"amber", record:"violet", rest:"teal", upm:"blue", aop:"amber", bmf:"violet", bpf:"green", xml:"blue", sql:"teal", config:"slate", archive:"amber", method:"teal", field:"blue", constant:"amber"};
const label = {class:"Java 类", interface:"Java 接口", enum:"Java 枚举", annotation:"Java 注解声明", record:"Java record", rest:"NC REST 声明", upm:"NC UPM 组件", aop:"NC AOP 声明", bmf:"NC 业务模型", bpf:"NC 业务流程"};
const redrawn = new Set(['project','source','rest','upm','aop','bmf','bpf','method','field','constant']);
function icon(kind, previous) {
  const version = previous || !redrawn.has(kind) ? 'v1' : 'v2';
  return `<svg viewBox="0 0 16 16" class="icon" style="--tone:var(--${tone[kind]})" aria-hidden="true"><use href="#${version}-${kind}"/></svg>`;
}
function row([kind,name,depth,disclosure,mark],previous) {
  const isFile = !disclosure;
  const dot = isFile ? name.lastIndexOf('.') : -1;
  const caret = disclosure ? `<svg width="10" height="10" viewBox="0 0 10 10"><path d="${disclosure==='open'?'m2 3.5 3 3 3-3':'m3.5 2 3 3-3 3'}" stroke="currentColor" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '';
  const nameHtml = dot > 0 ? `<span class="stem">${name.slice(0,dot)}</span><span class="ext">${name.slice(dot)}</span>` : `<span class="stem">${name}</span>`;
  return `<div class="row" style="--depth:${depth}" data-depth="${depth}" ${kind==='project'?'data-current':''} ${kind==='rest'?'data-active':''} data-group="${!!disclosure}" title="${name}${label[kind]?' · '+label[kind]:''}"><span class="caret" aria-hidden="true">${caret}</span>${icon(kind,previous)}<span class="name">${nameHtml}</span>${mark?`<span class="badge ${mark==='T'?'test':''}">${mark}</span>`:''}</div>`;
}
const comparisons = [["上一版","浅色 · 16px","previous"],["第二版","浅色 · 16px","light"],["第二版","深色 · 16px","dark"]];
document.getElementById('comparison').innerHTML = comparisons.map(([title,meta,theme]) => `<section class="column" aria-label="${title} ${meta}"><div class="caption"><strong>${title}</strong><span>${meta}</span></div><div class="tree ${theme}"><div class="bar"><span>包资源管理器</span><span class="mode">包视图</span></div><div class="list">${nodes.map(n=>row(n,theme==='previous')).join('')}</div><div class="bottom"><span>20 个节点</span><span>SVN · 已修改 1 项</span></div></div></section>`).join('');
document.getElementById('member-icons').innerHTML = `<b>成员</b>${[['method','方法'],['field','字段'],['constant','常量']].map(([kind,name])=>`<span>${icon(kind,false)}${name}</span>`).join('')}`;
</script>

</html>
